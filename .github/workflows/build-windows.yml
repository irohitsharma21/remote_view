name: Build Windows agent (.exe)

# Builds a ready-to-run Windows agent with your relay URL / secret / code baked in,
# then publishes it to the "latest" GitHub Release so there is a permanent link:
#
#   https://github.com/irohitsharma21/remote_view/releases/latest/download/remote_agent.exe
#
# Runs automatically on push to main, or manually (Actions -> Run workflow) if you
# want to override the server/secret/code for a one-off build.
on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Relay URL (wss://...)'
        required: false
        default: 'wss://remote-view-relay.onrender.com'
      secret:
        description: 'Agent secret (blank = use the AGENT_SECRET repo secret)'
        required: false
        default: ''
      code:
        description: 'Fixed access code (6 digits), blank = random each run'
        required: false
        default: '123456'
  push:
    branches: [ main ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write   # needed to publish the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements-agent.txt pyinstaller

      - name: Bake in server / secret / code
        shell: bash
        env:
          # Manual runs use the inputs; push builds fall back to these defaults.
          IN_SERVER: ${{ github.event.inputs.server || 'wss://remote-view-relay.onrender.com' }}
          IN_SECRET: ${{ github.event.inputs.secret || secrets.AGENT_SECRET }}
          IN_CODE: ${{ github.event.inputs.code || '123456' }}
        run: |
          python - <<'PY'
          import os, re
          p = "agent/agent.py"
          s = open(p, encoding="utf-8").read()
          def setval(name, val):
              global s
              s = re.sub(rf'{name} = ".*?"', f'{name} = "{val}"', s, count=1)
          setval("SERVER_DEFAULT", os.environ["IN_SERVER"])
          setval("SECRET_DEFAULT", os.environ["IN_SECRET"])
          setval("CODE_DEFAULT", os.environ["IN_CODE"])
          open(p, "w", encoding="utf-8").write(s)
          print(f"Baked: {os.environ['IN_SERVER']} / {os.environ['IN_SECRET']} / {os.environ['IN_CODE']}")
          PY

      - name: Build .exe
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --name remote_agent \
            --collect-submodules pynput \
            agent/agent.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote_agent-windows
          path: dist/remote_agent.exe
          if-no-files-found: error

      - name: Publish to "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Windows agent (latest build)
          body: |
            Ready-to-run Windows agent. Double-click to connect to the relay.
            Built from commit ${{ github.sha }}.
          files: dist/remote_agent.exe
          make_latest: true
