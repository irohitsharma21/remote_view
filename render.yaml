# Render.com deploy config (free, persistent, supports WebSockets).
# 1. Push this repo to GitHub (done).
# 2. On render.com: New -> Blueprint -> pick this repo. Render reads this file.
# 3. Set REMOTE_ADMIN_PASSWORD and REMOTE_AGENT_SECRET when prompted.
# 4. Deploy -> you get https://<name>.onrender.com
#    - dashboard:   https://<name>.onrender.com
#    - agent:       --server wss://<name>.onrender.com
services:
  - type: web
    name: remote-view-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: REMOTE_ADMIN_PASSWORD
        sync: false   # set your own in the Render dashboard
      - key: REMOTE_AGENT_SECRET
        sync: false   # set your own in the Render dashboard
